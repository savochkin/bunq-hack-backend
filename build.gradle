plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.5'
    id 'io.spring.dependency-management' version '1.1.3'
}

group = 'nl.bunq.hackathon'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

 //If you're using an older Gradle version that doesn't use settings.gradle for repositories
 //Uncomment these lines:
// repositories {
//     mavenCentral()
//     maven { url 'https://jitpack.io' }
// }

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Boot DevTools for development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // HTTP Client
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
    implementation 'org.apache.httpcomponents.client5:httpclient5-fluent:5.3.1'

    // JSON Processing
//    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'org.json:json:20250107'

    // Security
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.77'

    implementation 'com.openai:openai-java:1.6.0'
    implementation 'org.apache.commons:commons-text:1.11.0'
    // Environment Variables
    implementation 'io.github.cdimascio:dotenv-java:2.3.2'

    // Bunq SDK - Using the correct JitPack format
    //implementation 'com.github.bunq:sdk_java:1.28.0'
    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
