version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - BUNQ_HACKATHON_OPENAI_API_KEY=${BUNQ_HACKATHON_OPENAI_API_KEY}
      - BUNQ_USER_API_KEY=${BUNQ_USER_API_KEY}
      - INSTALLATION_TOKEN=${INSTALLATION_TOKEN}
    volumes:
      - ./installation.key:/app/installation.key:ro
      - ./src/test/resources:/app/src/test/resources:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
